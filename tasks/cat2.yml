- name: "MEDIUM | V-248519 | The OL 8 audit package must be installed."
  block:
    - name: stigrule_248519_audit
      yum:
        name: audit
        state: "{{ ol8STIG_stigrule_248519_audit_State }}"
      when: ol8STIG_stigrule_248519_Manage
  ignore_errors: true
  tags:
    - cat2
    - medium
    - V-248519
    - patch

- name: "MEDIUM | V-248520 | OL 8 audit records must contain information to establish what type of events occurred, the source of events, where events occurred, and the outcome of events."
  block:
    - name: check if auditd.service is installed
      shell: ! systemctl list-unit-files | grep "^auditd.service[ \t]\+"
      changed_when: False
      check_mode: no
      register: result
      failed_when: result.rc > 1
    - name: stigrule_248520_auditd_enable
      service:
        name: auditd.service
        enabled: "{{ ol8STIG_stigrule_248520_auditd_enable_Enabled }}"
      when:
        - ol8STIG_stigrule_248520_Manage
        - result.rc == 0
    - name: check if auditd.service is installed
      shell: ! systemctl list-unit-files | grep "^auditd.service[ \t]\+"
      changed_when: False
      check_mode: no
      register: result
      failed_when: result.rc > 1
    - name: stigrule_248520_auditd_start
      service:
        name: auditd.service
        state: "{{ ol8STIG_stigrule_248520_auditd_start_State }}"
      when:
        - ol8STIG_stigrule_248520_Manage
        - result.rc == 0
  ignore_errors: true
  tags:
    - cat2
    - medium
    - V-248520
    - patch

